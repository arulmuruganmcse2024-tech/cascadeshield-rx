<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="title-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="red-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="yt-btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033" />
      <stop offset="100%" stop-color="#CC0000" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="play-btn-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#FF0033" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#10B981" flood-opacity="0.45" />
    </filter>

    <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1200" height="675" fill="url(#bg-canvas)" rx="20" />
  
  <!-- Subtle Outer Border -->
  <rect width="1200" height="675" fill="none" stroke="#334155" stroke-width="1.5" rx="20" />

  <!-- 2. Technical Blueprint Grid -->
  <g opacity="0.08" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" stroke-dasharray="4 4" />
    <line x1="0" y1="270" x2="1200" y2="270" stroke-dasharray="4 4" />
    <line x1="0" y1="405" x2="1200" y2="405" stroke-dasharray="4 4" />
    <line x1="0" y1="540" x2="1200" y2="540" stroke-dasharray="4 4" />
    <line x1="240" y1="0" x2="240" y2="675" stroke-dasharray="4 4" />
    <line x1="480" y1="0" x2="480" y2="675" stroke-dasharray="4 4" />
    <line x1="720" y1="0" x2="720" y2="675" stroke-dasharray="4 4" />
    <line x1="960" y1="0" x2="960" y2="675" stroke-dasharray="4 4" />
  </g>

  <!-- 3. Ambient Lighting Halos -->
  <circle cx="600" cy="340" r="260" fill="#2563EB" opacity="0.12" filter="blur(80px)" />
  <circle cx="200" cy="180" r="180" fill="#38BDF8" opacity="0.08" filter="blur(60px)" />
  <circle cx="1020" cy="460" r="200" fill="#10B981" opacity="0.1" filter="blur(70px)" />
  <circle cx="600" cy="340" r="100" fill="#FF0033" opacity="0.18" filter="blur(50px)" />

  <!-- 4. TOP HEADER BAR -->
  <g transform="translate(60, 56)">
    <!-- Pill Badge: Next Byte V5 & Clinical CDSS -->
    <g>
      <rect width="260" height="32" rx="16" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1.5" />
      <circle cx="18" cy="16" r="4.5" fill="#F59E0B" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11.5" fill="#FBBF24" letter-spacing="1">
        CLINICAL DEMO • NEXT BYTE V5
      </text>
    </g>

    <!-- Standards Pill on Right -->
    <g transform="translate(820, 0)">
      <rect width="260" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="16" r="4" fill="#10B981" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#CBD5E1">
        15/15 CLINICAL TESTS PASS
      </text>
    </g>

    <!-- Main Title & Subtitle -->
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#title-glow)" letter-spacing="-1.5">
      CascadeShield <tspan fill="#38BDF8">Rx</tspan>
    </text>
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="18" fill="#94A3B8">
      Unmasking Prescribing Cascades, PK Deprescribing &amp; HL7 FHIR R4 Interoperability
    </text>
  </g>

  <!-- 5. BACKGROUND CLINICAL CAUSAL GRAPH (Subtle preview in background) -->
  <g transform="translate(60, 200)" opacity="0.65">
    <!-- Connecting Laser Edges -->
    <path d="M 180 150 C 210 110, 250 110, 280 150" fill="none" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrowhead)" stroke-dasharray="4 4" />
    <path d="M 440 150 C 470 110, 510 110, 540 150" fill="none" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrowhead)" stroke-dasharray="4 4" />
    <path d="M 700 150 C 730 110, 770 110, 800 150" fill="none" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrowhead)" stroke-dasharray="4 4" />

    <!-- Node 1: Amlodipine 10mg -->
    <g transform="translate(10, 130)" filter="url(#shadow-soft)">
      <rect width="170" height="92" rx="12" fill="url(#card-grad)" stroke="#38BDF8" stroke-width="1.8" />
      <rect x="12" y="12" width="56" height="18" rx="6" fill="#0284C7" />
      <text x="40" y="25" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="9.5" fill="#FFFFFF">DAY 0</text>
      <text x="12" y="50" font-family="sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">Amlodipine 10mg</text>
      <text x="12" y="68" font-family="sans-serif" font-weight="500" font-size="11" fill="#94A3B8">Root CCB Vasodilator</text>
      <text x="12" y="84" font-family="sans-serif" font-weight="700" font-size="10" fill="#F87171">ADR: Precapillary Edema</text>
    </g>

    <!-- Node 2: Furosemide 40mg -->
    <g transform="translate(270, 130)" filter="url(#shadow-soft)">
      <rect width="170" height="92" rx="12" fill="url(#card-grad)" stroke="#F87171" stroke-width="1.8" />
      <rect x="12" y="12" width="60" height="18" rx="6" fill="#B91C1C" />
      <text x="42" y="25" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="9.5" fill="#FFFFFF">DAY 24</text>
      <text x="12" y="50" font-family="sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">Furosemide 40mg</text>
      <text x="12" y="68" font-family="sans-serif" font-weight="500" font-size="11" fill="#94A3B8">Loop Diuretic (aSR 1.93)</text>
      <text x="12" y="84" font-family="sans-serif" font-weight="700" font-size="10" fill="#F87171">ADR: Urinary Frequency</text>
    </g>

    <!-- Node 3: Oxybutynin 10mg -->
    <g transform="translate(530, 130)" filter="url(#shadow-soft)">
      <rect width="170" height="92" rx="12" fill="url(#card-grad)" stroke="#EF4444" stroke-width="1.8" />
      <rect x="12" y="12" width="60" height="18" rx="6" fill="#991B1B" />
      <text x="42" y="25" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="9.5" fill="#FFFFFF">DAY 52</text>
      <text x="12" y="50" font-family="sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">Oxybutynin 10mg</text>
      <text x="12" y="68" font-family="sans-serif" font-weight="700" font-size="11" fill="#C084FC">Anticholinergic ACB=3</text>
      <text x="12" y="84" font-family="sans-serif" font-weight="700" font-size="10" fill="#F87171">ADR: Central Cognitive Decline</text>
    </g>

    <!-- Node 4: Donepezil 5mg -->
    <g transform="translate(790, 130)" filter="url(#shadow-soft)">
      <rect width="170" height="92" rx="12" fill="url(#card-grad)" stroke="#DC2626" stroke-width="1.8" />
      <rect x="12" y="12" width="60" height="18" rx="6" fill="#7F1D1D" />
      <text x="42" y="25" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="9.5" fill="#FFFFFF">DAY 85</text>
      <text x="12" y="50" font-family="sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">Donepezil 5mg</text>
      <text x="12" y="68" font-family="sans-serif" font-weight="500" font-size="11" fill="#94A3B8">AChEI Prescribed for Memory</text>
      <text x="12" y="84" font-family="sans-serif" font-weight="700" font-size="10" fill="#F87171">ADR: Nightmares &amp; Insomnia</text>
    </g>

    <!-- Edge Delta Badges -->
    <g transform="translate(195, 96)">
      <rect width="70" height="18" rx="9" fill="#450A0A" stroke="#DC2626" stroke-width="1" />
      <text x="35" y="12.5" text-anchor="middle" font-family="monospace" font-weight="700" font-size="9" fill="#FCA5A5">Δt=24d</text>
    </g>
    <g transform="translate(455, 96)">
      <rect width="70" height="18" rx="9" fill="#450A0A" stroke="#DC2626" stroke-width="1" />
      <text x="35" y="12.5" text-anchor="middle" font-family="monospace" font-weight="700" font-size="9" fill="#FCA5A5">Δt=28d</text>
    </g>
    <g transform="translate(715, 96)">
      <rect width="70" height="18" rx="9" fill="#450A0A" stroke="#DC2626" stroke-width="1" />
      <text x="35" y="12.5" text-anchor="middle" font-family="monospace" font-weight="700" font-size="9" fill="#FCA5A5">Δt=33d</text>
    </g>
  </g>

  <!-- 6. FOREGROUND HERO PLAY BUTTON & OVERLAY (Prominent Center) -->
  <g transform="translate(600, 355)">
    <!-- Outer Translucent Pulse Ring -->
    <circle r="72" fill="#FF0033" opacity="0.14" />
    <circle r="56" fill="#000000" opacity="0.5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

    <!-- YouTube Crimson Play Button -->
    <g filter="url(#play-btn-glow)">
      <!-- Standard YouTube Play Shape -->
      <rect x="-48" y="-34" width="96" height="68" rx="20" fill="url(#yt-btn-grad)" />
      <!-- White Play Triangle -->
      <path d="M -12 -18 L 18 0 L -12 18 Z" fill="#FFFFFF" />
    </g>

    <!-- Action Callout Prompt -->
    <g transform="translate(0, 64)">
      <rect x="-170" y="0" width="340" height="32" rx="16" fill="#090D16" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <text x="0" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#F8FAFC" letter-spacing="0.3">
        CLICK TO PLAY CLINICAL VIDEO DEMO (2:48)
      </text>
    </g>
  </g>

  <!-- 7. BOTTOM RESOLUTION PILL & METRICS BAR -->
  <g transform="translate(60, 580)">
    <!-- Root Deprescribing Callout Pill -->
    <rect width="360" height="42" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5" filter="url(#green-glow)" />
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#ECFDF5">
      Root Intervention: Amlodipine → Losartan 50mg
    </text>

    <!-- Metrics Strip -->
    <g transform="translate(380, 0)">
      <rect width="700" height="42" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12.5" fill="#E2E8F0">
        <tspan fill="#34D399">PHI: 92 → 12 (-80)</tspan>
        <tspan fill="#64748B" dx="18">|</tspan>
        <tspan fill="#38BDF8" dx="18">ACB: 4 → 0 (Dementia-Safe)</tspan>
        <tspan fill="#64748B" dx="18">|</tspan>
        <tspan fill="#FBBF24" dx="18">$4,800 ADE Avoided</tspan>
        <tspan fill="#64748B" dx="18">|</tspan>
        <tspan fill="#A855F7" dx="18">1080p 60fps HD</tspan>
      </text>
    </g>
  </g>
</svg>
