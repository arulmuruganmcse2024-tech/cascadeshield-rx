<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accent Highlights -->
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.3" />
    </filter>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10B981" flood-opacity="0.3" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowHeadEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="620" fill="url(#bgCanvas)" rx="16" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="4 4" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke-dasharray="4 4" />
    <line x1="0" y1="360" x2="1200" y2="360" stroke-dasharray="4 4" />
    <line x1="0" y1="480" x2="1200" y2="480" stroke-dasharray="4 4" />
    <line x1="280" y1="0" x2="280" y2="620" stroke-dasharray="4 4" />
    <line x1="600" y1="0" x2="600" y2="620" stroke-dasharray="4 4" />
    <line x1="900" y1="0" x2="900" y2="620" stroke-dasharray="4 4" />
  </g>

  <!-- HEADER -->
  <g transform="translate(48, 40)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="-0.5">
      CascadeShield <tspan fill="#38BDF8">Rx</tspan> Architecture Overview
    </text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#94A3B8">
      Deterministic Clinical Intelligence Pipeline: Ingestion → DAG Engine → Federal REST → Counterfactual Deprescribing
    </text>
  </g>

  <!-- COL 1: CLINICAL INGESTION -->
  <g transform="translate(48, 110)">
    <rect width="250" height="460" rx="12" fill="#0B132B" stroke="#1E293B" stroke-width="1.5" />
    <rect width="250" height="36" rx="12" fill="#1E293B" />
    <text x="16" y="23" font-family="sans-serif" font-weight="800" font-size="12" fill="#38BDF8" letter-spacing="0.5">1. CLINICAL INGESTION</text>

    <!-- Input Card 1 -->
    <g transform="translate(16, 52)">
      <rect width="218" height="85" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="14" y="26" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Patient Demographics</text>
      <text x="14" y="46" font-family="sans-serif" font-size="11" fill="#94A3B8">Age, Sex, Weight (kg)</text>
      <text x="14" y="64" font-family="monospace" font-size="11" fill="#38BDF8">Serum Creatinine (SCr)</text>
    </g>

    <!-- Input Card 2 -->
    <g transform="translate(16, 150)">
      <rect width="218" height="85" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="14" y="26" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Medication Regimen</text>
      <text x="14" y="46" font-family="sans-serif" font-size="11" fill="#94A3B8">Chronological Start Dates</text>
      <text x="14" y="64" font-family="monospace" font-size="11" fill="#38BDF8">Dosage &amp; Reported Symptoms</text>
    </g>

    <!-- Input Card 3 -->
    <g transform="translate(16, 248)">
      <rect width="218" height="85" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="14" y="26" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Clinical Note NLP</text>
      <text x="14" y="46" font-family="sans-serif" font-size="11" fill="#94A3B8">Discharge Summaries</text>
      <text x="14" y="64" font-family="monospace" font-size="11" fill="#38BDF8">Brand-to-Generic Synonyms</text>
    </g>

    <!-- Input Card 4 -->
    <g transform="translate(16, 346)">
      <rect width="218" height="96" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Pre-loaded Case Cohorts</text>
      <text x="14" y="44" font-family="sans-serif" font-size="10.5" fill="#94A3B8">• Martha V. (4-Drug Domino)</text>
      <text x="14" y="60" font-family="sans-serif" font-size="10.5" fill="#94A3B8">• Arthur K. (CKD4 &amp; Myalgia)</text>
      <text x="14" y="76" font-family="sans-serif" font-size="10.5" fill="#94A3B8">• Eleanor R. (Reconciliation)</text>
    </g>
  </g>

  <!-- ARROW 1 -> 2 -->
  <path d="M 298 340 L 338 340" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowHead)" />

  <!-- COL 2: CORE DETERMINISTIC CDSS ENGINE -->
  <g transform="translate(344, 110)">
    <rect width="280" height="460" rx="12" fill="#062820" stroke="#047857" stroke-width="1.5" />
    <rect width="280" height="36" rx="12" fill="#064E3B" />
    <text x="16" y="23" font-family="sans-serif" font-weight="800" font-size="12" fill="#34D399" letter-spacing="0.5">2. DETERMINISTIC CLINICAL ENGINE</text>

    <!-- Engine Module 1: Cockcroft-Gault -->
    <g transform="translate(16, 52)">
      <rect width="248" height="85" rx="8" fill="#063529" stroke="#059669" stroke-width="1" />
      <text x="14" y="24" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Cockcroft-Gault Renal Clearance</text>
      <text x="14" y="44" font-family="sans-serif" font-size="11" fill="#A7F3D0">Sarcopenia Floor Clamping (SCr ≥ 0.4)</text>
      <text x="14" y="64" font-family="monospace" font-size="11" fill="#34D399">CrCl = (140-Age)×Wt / (72×SCr) [×0.85]</text>
    </g>

    <!-- Engine Module 2: Prescribing Cascade DAG -->
    <g transform="translate(16, 150)">
      <rect width="248" height="96" rx="8" fill="#063529" stroke="#059669" stroke-width="1" />
      <text x="14" y="24" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Chronological Cascade DAG</text>
      <text x="14" y="44" font-family="sans-serif" font-size="11" fill="#A7F3D0">12 BMJ &amp; ThinkCascades Rules</text>
      <text x="14" y="62" font-family="sans-serif" font-size="10.5" fill="#94A3B8">Temporal latency window weighting</text>
      <text x="14" y="80" font-family="monospace" font-size="10.5" fill="#34D399">Confounder comorbidity damping (γ=0.65)</text>
    </g>

    <!-- Engine Module 3: Beers & Cognitive Burden -->
    <g transform="translate(16, 258)">
      <rect width="248" height="85" rx="8" fill="#063529" stroke="#059669" stroke-width="1" />
      <text x="14" y="24" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Beers Criteria &amp; ACB Scoring</text>
      <text x="14" y="44" font-family="sans-serif" font-size="11" fill="#A7F3D0">2023 AGS Beers Table 2 &amp; Table 6</text>
      <text x="14" y="64" font-family="monospace" font-size="11" fill="#34D399">Boustani ACB (Dementia Risk OR=2.63)</text>
    </g>

    <!-- Engine Module 4: Harm Index PHI -->
    <g transform="translate(16, 355)">
      <rect width="248" height="87" rx="8" fill="#063529" stroke="#059669" stroke-width="1" />
      <text x="14" y="24" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Composite Harm Index (PHI)</text>
      <text x="14" y="44" font-family="sans-serif" font-size="11" fill="#A7F3D0">Dose-Weighted DBI + Renal Alert Penalties</text>
      <text x="14" y="66" font-family="monospace" font-size="11" fill="#F87171">PHI 0 - 100 Risk Quantification</text>
    </g>
  </g>

  <!-- ARROW 2 -> 3 -->
  <path d="M 624 340 L 664 340" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arrowHeadEmerald)" />

  <!-- COL 3: FEDERAL REST & HYBRID RUNTIME -->
  <g transform="translate(670, 110)">
    <rect width="240" height="460" rx="12" fill="#1E1B4B" stroke="#4338CA" stroke-width="1.5" />
    <rect width="240" height="36" rx="12" fill="#312E81" />
    <text x="16" y="23" font-family="sans-serif" font-weight="800" font-size="12" fill="#A5B4FC" letter-spacing="0.5">3. FEDERAL REST DATA</text>

    <!-- Fed Endpoint 1: RxNorm -->
    <g transform="translate(16, 52)">
      <rect width="208" height="85" rx="8" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1" />
      <text x="12" y="24" font-family="sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">NIH NLM RxNorm</text>
      <text x="12" y="44" font-family="mono" font-size="10" fill="#94A3B8">rxnav.nlm.nih.gov</text>
      <text x="12" y="64" font-family="sans-serif" font-size="10.5" fill="#A5B4FC">RxCUI Concept Resolver</text>
    </g>

    <!-- Fed Endpoint 2: RxClass -->
    <g transform="translate(16, 150)">
      <rect width="208" height="85" rx="8" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1" />
      <text x="12" y="24" font-family="sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">NIH NLM RxClass</text>
      <text x="12" y="44" font-family="mono" font-size="10" fill="#94A3B8">class/byRxcui.json</text>
      <text x="12" y="64" font-family="sans-serif" font-size="10.5" fill="#A5B4FC">Therapeutic Drug Class</text>
    </g>

    <!-- Fed Endpoint 3: OpenFDA -->
    <g transform="translate(16, 248)">
      <rect width="208" height="85" rx="8" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1" />
      <text x="12" y="24" font-family="sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">US FDA OpenFDA FAERS</text>
      <text x="12" y="44" font-family="mono" font-size="10" fill="#94A3B8">api.fda.gov/drug/event.json</text>
      <text x="12" y="64" font-family="sans-serif" font-size="10.5" fill="#A5B4FC">Real-World ADE Counts</text>
    </g>

    <!-- Offline Reference Cache Box -->
    <g transform="translate(16, 346)">
      <rect width="208" height="96" rx="8" fill="#17172E" stroke="#6366F1" stroke-width="1" stroke-dasharray="3 3" />
      <text x="12" y="24" font-family="sans-serif" font-weight="700" font-size="12" fill="#C7D2FE">Offline Reference Cache</text>
      <text x="12" y="44" font-family="sans-serif" font-size="10.5" fill="#94A3B8">25+ Core Geriatric Meds</text>
      <text x="12" y="62" font-family="sans-serif" font-size="10" fill="#A5B4FC">2000ms AbortController</text>
      <text x="12" y="78" font-family="sans-serif" font-size="10" fill="#34D399">0ms Instant Failover</text>
    </g>
  </g>

  <!-- ARROW 3 -> 4 -->
  <path d="M 910 340 L 946 340" fill="none" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowHead)" />

  <!-- COL 4: CLINICAL DELIVERABLES -->
  <g transform="translate(952, 110)">
    <rect width="200" height="460" rx="12" fill="#0B132B" stroke="#1E293B" stroke-width="1.5" />
    <rect width="200" height="36" rx="12" fill="#1E293B" />
    <text x="14" y="23" font-family="sans-serif" font-weight="800" font-size="11.5" fill="#38BDF8" letter-spacing="0.5">4. ACTIONABLE OUTPUTS</text>

    <!-- Output 1: Interactive SVG Graph -->
    <g transform="translate(14, 52)">
      <rect width="172" height="85" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" font-family="sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">Causal Time-Graph</text>
      <text x="12" y="44" font-family="sans-serif" font-size="10.5" fill="#94A3B8">Animated SVG DAG</text>
      <text x="12" y="64" font-family="monospace" font-size="10.5" fill="#38BDF8">Interactive Node Detail</text>
    </g>

    <!-- Output 2: BFS Simulation -->
    <g transform="translate(14, 150)">
      <rect width="172" height="85" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" font-family="sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">BFS Deprescribing</text>
      <text x="12" y="44" font-family="sans-serif" font-size="10.5" fill="#94A3B8">Root-Cause Switch</text>
      <text x="12" y="64" font-family="monospace" font-size="10.5" fill="#34D399">PHI 92 → 12 Delta</text>
    </g>

    <!-- Output 3: FHIR R4 Bundle -->
    <g transform="translate(14, 248)">
      <rect width="172" height="85" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" font-family="sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">HL7 FHIR R4 Export</text>
      <text x="12" y="44" font-family="sans-serif" font-size="10.5" fill="#94A3B8">US-Core Resources</text>
      <text x="12" y="64" font-family="monospace" font-size="10.5" fill="#A5B4FC">Patient &amp; DetectedIssue</text>
    </g>

    <!-- Output 4: 1-Page Handoff Brief -->
    <g transform="translate(14, 346)">
      <rect width="172" height="96" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="12" y="24" font-family="sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">Clinical Handoff Brief</text>
      <text x="12" y="44" font-family="sans-serif" font-size="10.5" fill="#94A3B8">@media print Ready</text>
      <text x="12" y="62" font-family="sans-serif" font-size="10" fill="#94A3B8">Prescribing Directive</text>
      <text x="12" y="78" font-family="sans-serif" font-size="10" fill="#38BDF8">Physician Attestation</text>
    </g>
  </g>
</svg>

